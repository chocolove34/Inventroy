<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banahaw Viewdeck Samgyupsal - Meat Inventory System</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Font: Plus Jakarta Sans -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Custom Input styling to match reference image rounded pill aesthetics */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-emerald-200 selection:text-emerald-900">

  <div id="root"></div>

  <script type="text/babel">
    const BookIcon = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    const ShareIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
    );

    const CalendarIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );

    const ChevronLeftIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
      </svg>
    );

    const ChevronRightIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
      </svg>
    );

    const UsersIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    );

    const TruckIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zm10 0a2 2 0 11-4 0 2 2 0 014 0zM13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 100-4 2 2 0 000 4zm10 0a2 2 0 100-4 2 2 0 000 4z" />
      </svg>
    );

    const PlusIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
      </svg>
    );

    const CheckIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
      </svg>
    );

    const UploadIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
    );

    const DownloadIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    function getTodayISO() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function getPreviousDateISO(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    function getNextDateISO(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[1]}/${parts[2]}/${parts[0]}`;
      }
      return dateStr;
    }

    const todayISO = getTodayISO();

    const INITIAL_DATABASE = {
      [todayISO]: {
        guestCount: 92,
        initialStock: { pork: 12.5, chicken: 10.0, beef: 10.0 },
        deliveries: [],
        consumed: { pork: 0, chicken: 0, beef: 0 },
        crewMealOption: 'none', // 'none' | 'pork' | 'chicken'
        crewMealAmount: 0.5
      }
    };

    function App() {
      const { useState, useMemo, useEffect, useRef } = React;

      const [selectedDate, setSelectedDate] = useState(todayISO);
      
      const [inventoryDb, setInventoryDb] = useState(() => {
        try {
          const saved = localStorage.getItem('banahaw_meat_inventory_exact_v1');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error('Error loading saved inventory state', e);
        }
        return INITIAL_DATABASE;
      });

      const [toastMessage, setToastMessage] = useState('');
      const [customLogo, setCustomLogo] = useState(null);
      const logoInputRef = useRef(null);

      // Delivery Pop-up Modal State
      const [isDeliveryModalOpen, setIsDeliveryModalOpen] = useState(false);
      const [deliveryInput, setDeliveryInput] = useState({ pork: '', chicken: '', beef: '', note: '' });

      // Export Modal State
      const [isExportModalOpen, setIsExportModalOpen] = useState(false);
      const [exportedPngUrl, setExportedPngUrl] = useState('');

      useEffect(() => {
        try {
          localStorage.setItem('banahaw_meat_inventory_exact_v1', JSON.stringify(inventoryDb));
        } catch (e) {
          console.error('Error saving inventory state', e);
        }
      }, [inventoryDb]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setCustomLogo(ev.target.result);
            showToast('Logo updated successfully!');
          };
          reader.readAsDataURL(file);
        }
      };

      const dayRecord = useMemo(() => {
        const getCarryoverFromPrevious = (dateStr, visited = new Set()) => {
          if (visited.has(dateStr)) return { pork: 12.5, chicken: 10.0, beef: 10.0 };
          visited.add(dateStr);

          const prevISO = getPreviousDateISO(dateStr);
          const prevData = inventoryDb[prevISO];

          if (!prevData) {
            return { pork: 12.5, chicken: 10.0, beef: 10.0 };
          }

          // Calculate previous day ending balance
          const initP = parseFloat(prevData.initialStock?.pork ?? 12.5);
          const initC = parseFloat(prevData.initialStock?.chicken ?? 10.0);
          const initB = parseFloat(prevData.initialStock?.beef ?? 10.0);

          const delTotals = (prevData.deliveries || []).reduce(
            (acc, curr) => ({
              pork: acc.pork + (parseFloat(curr.pork) || 0),
              chicken: acc.chicken + (parseFloat(curr.chicken) || 0),
              beef: acc.beef + (parseFloat(curr.beef) || 0)
            }),
            { pork: 0, chicken: 0, beef: 0 }
          );

          const consP = parseFloat(prevData.consumed?.pork ?? 0);
          const consC = parseFloat(prevData.consumed?.chicken ?? 0);
          const consB = parseFloat(prevData.consumed?.beef ?? 0);

          const crewOpt = prevData.crewMealOption || 'none';
          const crewAmt = parseFloat(prevData.crewMealAmount ?? 0.5);
          const crewP = crewOpt === 'pork' ? crewAmt : 0;
          const crewC = crewOpt === 'chicken' ? crewAmt : 0;

          return {
            pork: Math.max(0, (initP + delTotals.pork) - consP - crewP),
            chicken: Math.max(0, (initC + delTotals.chicken) - consC - crewC),
            beef: Math.max(0, (initB + delTotals.beef) - consB)
          };
        };

        const existing = inventoryDb[selectedDate];
        if (existing) {
          return {
            guestCount: existing.guestCount ?? 92,
            initialStock: existing.initialStock ?? { pork: 12.5, chicken: 10.0, beef: 10.0 },
            deliveries: existing.deliveries || [],
            consumed: existing.consumed || { pork: 0, chicken: 0, beef: 0 },
            crewMealOption: existing.crewMealOption || 'none',
            crewMealAmount: existing.crewMealAmount ?? 0.5
          };
        }

        // Default auto carryover for fresh date
        const carried = getCarryoverFromPrevious(selectedDate);
        return {
          guestCount: 92,
          initialStock: carried,
          deliveries: [],
          consumed: { pork: 0, chicken: 0, beef: 0 },
          crewMealOption: 'none',
          crewMealAmount: 0.5
        };
      }, [selectedDate, inventoryDb]);

      const computed = useMemo(() => {
        const parseFloatOrZero = (v) => {
          if (v === '' || v === undefined || v === null) return 0;
          const n = parseFloat(v);
          return isNaN(n) ? 0 : n;
        };

        const init = {
          pork: parseFloatOrZero(dayRecord.initialStock.pork),
          chicken: parseFloatOrZero(dayRecord.initialStock.chicken),
          beef: parseFloatOrZero(dayRecord.initialStock.beef)
        };

        const delTotals = dayRecord.deliveries.reduce(
          (acc, curr) => ({
            pork: acc.pork + parseFloatOrZero(curr.pork),
            chicken: acc.chicken + parseFloatOrZero(curr.chicken),
            beef: acc.beef + parseFloatOrZero(curr.beef)
          }),
          { pork: 0, chicken: 0, beef: 0 }
        );

        const totalAvailable = {
          pork: init.pork + delTotals.pork,
          chicken: init.chicken + delTotals.chicken,
          beef: init.beef + delTotals.beef
        };

        const cons = {
          pork: parseFloatOrZero(dayRecord.consumed.pork),
          chicken: parseFloatOrZero(dayRecord.consumed.chicken),
          beef: parseFloatOrZero(dayRecord.consumed.beef)
        };

        const crewOpt = dayRecord.crewMealOption || 'none';
        const crewAmt = parseFloatOrZero(dayRecord.crewMealAmount || 0.5);
        const crewPork = crewOpt === 'pork' ? crewAmt : 0;
        const crewChick = crewOpt === 'chicken' ? crewAmt : 0;

        const rem = {
          pork: Math.max(0, totalAvailable.pork - cons.pork - crewPork),
          chicken: Math.max(0, totalAvailable.chicken - cons.chicken - crewChick),
          beef: Math.max(0, totalAvailable.beef - cons.beef)
        };

        const totalInitKg = totalAvailable.pork + totalAvailable.chicken + totalAvailable.beef;
        const totalRemKg = rem.pork + rem.chicken + rem.beef;
        const totalConsKg = cons.pork + cons.chicken + cons.beef + crewPork + crewChick;

        const guests = Math.max(1, dayRecord.guestCount || 1);
        const factor = totalConsKg / guests;

        return {
          initial: init,
          deliveriesTotal: delTotals,
          totalAvailable,
          consumed: cons,
          crewMealOption: crewOpt,
          crewMealAmount: crewAmt,
          remaining: rem,
          totalInitKg,
          totalRemKg,
          totalConsKg,
          guests,
          factor,
          factorFormatted: factor.toFixed(3)
        };
      }, [dayRecord]);

      const updateGuestCount = (val) => {
        const num = Math.max(0, parseInt(val, 10) || 0);
        setInventoryDb(prev => ({
          ...prev,
          [selectedDate]: {
            ...(prev[selectedDate] || dayRecord),
            guestCount: num
          }
        }));
      };

      const updateInitialMeat = (field, val) => {
        setInventoryDb(prev => {
          const current = prev[selectedDate] || dayRecord;
          return {
            ...prev,
            [selectedDate]: {
              ...current,
              initialStock: {
                ...(current.initialStock || dayRecord.initialStock),
                [field]: val
              }
            }
          };
        });
      };

      const updateConsumedMeat = (field, val) => {
        setInventoryDb(prev => {
          const current = prev[selectedDate] || dayRecord;
          return {
            ...prev,
            [selectedDate]: {
              ...current,
              consumed: {
                ...(current.consumed || dayRecord.consumed),
                [field]: val
              }
            }
          };
        });
      };

      const updateCrewMealOption = (option) => {
        setInventoryDb(prev => {
          const current = prev[selectedDate] || dayRecord;
          return {
            ...prev,
            [selectedDate]: {
              ...current,
              crewMealOption: option
            }
          };
        });
      };

      const handleOpenDeliveryModal = () => {
        setDeliveryInput({ pork: '', chicken: '', beef: '', note: '' });
        setIsDeliveryModalOpen(true);
      };

      const handleSaveDelivery = (e) => {
        e.preventDefault();
        const p = parseFloat(deliveryInput.pork) || 0;
        const c = parseFloat(deliveryInput.chicken) || 0;
        const b = parseFloat(deliveryInput.beef) || 0;

        if (p <= 0 && c <= 0 && b <= 0) {
          showToast('Please enter at least one meat amount (> 0 kg)');
          return;
        }

        const newDelivery = {
          id: 'del-' + Date.now(),
          pork: p,
          chicken: c,
          beef: b,
          note: deliveryInput.note.trim() || 'New Stock Delivery',
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setInventoryDb(prev => {
          const current = prev[selectedDate] || dayRecord;
          const currentDeliveries = current.deliveries || [];
          
          // Also option to directly add to initial stock values for immediate visibility
          const newInitial = {
            pork: (parseFloat(current.initialStock?.pork) || 0) + p,
            chicken: (parseFloat(current.initialStock?.chicken) || 0) + c,
            beef: (parseFloat(current.initialStock?.beef) || 0) + b
          };

          return {
            ...prev,
            [selectedDate]: {
              ...current,
              initialStock: newInitial,
              deliveries: [...currentDeliveries, newDelivery]
            }
          };
        });

        setIsDeliveryModalOpen(false);
        showToast(`Added +${(p + c + b).toFixed(1)} kg to Stock!`);
      };

      const generatePNG = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 1000;

        // Background light slate
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Header Card
        ctx.fillStyle = '#d1fae5';
        ctx.beginPath();
        ctx.roundRect(30, 30, 740, 110, 16);
        ctx.fill();

        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.roundRect(50, 50, 50, 50, 12);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('📖', 62, 85);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Banahaw Viewdeck Samgyupsal - Lucban', 115, 75);

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('INVENTORY REPORT', 115, 98);

        // Date Bar
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(30, 155, 740, 60, 14);
        ctx.fill();

        ctx.fillStyle = '#334155';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`Date: ${formatDateDisplay(selectedDate)}`, 50, 192);
        ctx.fillText(`Total Guests: ${computed.guests} Pax`, 540, 192);

        let y = 230;

        // Function to draw section cards
        const drawSectionCard = (title, totalKg, bgBadge, textBadge, items, isInput = false, colorHex = '#1e40af') => {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(30, y, 740, 145, 16);
          ctx.fill();

          ctx.fillStyle = colorHex;
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText(`• ${title}`, 50, y + 35);

          ctx.fillStyle = bgBadge;
          ctx.beginPath();
          ctx.roundRect(570, y + 15, 180, 32, 16);
          ctx.fill();

          ctx.fillStyle = textBadge;
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText(`Total: ${totalKg.toFixed(1)} kg`, 600, y + 36);

          // Items grid
          const itemWidth = 220;
          items.forEach((item, idx) => {
            const ix = 50 + idx * 240;
            const iy = y + 65;

            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.roundRect(ix, iy, itemWidth, 55, 12);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(item.label, ix + 15, iy + 33);

            ctx.fillStyle = colorHex;
            ctx.font = 'bold 15px monospace';
            ctx.fillText(`${parseFloat(item.val || 0).toFixed(1)} kg`, ix + 120, iy + 33);
          });

          y += 160;
        };

        drawSectionCard('INITIAL:', computed.totalInitKg, '#dbeafe', '#1e40af', [
          { label: 'Pork', val: computed.initial.pork },
          { label: 'Chicken', val: computed.initial.chicken },
          { label: 'Beef', val: computed.initial.beef }
        ], false, '#1d4ed8');

        drawSectionCard('REMAINING:', computed.totalRemKg, '#dcfce7', '#15803d', [
          { label: 'Pork', val: computed.remaining.pork },
          { label: 'Chicken', val: computed.remaining.chicken },
          { label: 'Beef', val: computed.remaining.beef }
        ], false, '#15803d');

        drawSectionCard('CONSUMED:', computed.totalConsKg, '#ffe4e6', '#9f1239', [
          { label: 'Pork', val: computed.consumed.pork },
          { label: 'Chicken', val: computed.consumed.chicken },
          { label: 'Beef', val: computed.consumed.beef }
        ], false, '#dc2626');

        // Summary Card
        ctx.fillStyle = '#ecfdf5';
        ctx.beginPath();
        ctx.roundRect(30, y, 740, 180, 16);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('SUMMARY', 50, y + 35);

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(50, y + 48, 700, 1.5);

        ctx.fillStyle = '#334155';
        ctx.font = '500 15px sans-serif';
        ctx.fillText('Total amount of consumed:', 50, y + 80);
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`${computed.totalConsKg.toFixed(1)} kg`, 650, y + 80);

        ctx.fillStyle = '#334155';
        ctx.font = '500 15px sans-serif';
        ctx.fillText('Total number of guest:', 50, y + 112);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`${computed.guests} Pax`, 650, y + 112);

        // Factor box
        ctx.fillStyle = '#d1fae5';
        ctx.beginPath();
        ctx.roundRect(50, y + 125, 140, 42, 10);
        ctx.fill();

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 20px monospace';
        ctx.fillText(computed.factorFormatted, 80, y + 153);

        const dataUrl = canvas.toDataURL('image/png');
        setExportedPngUrl(dataUrl);
        setIsExportModalOpen(true);
      };

      return (
        <div className="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
          
          {/* Toast Banner */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white text-xs sm:text-sm font-bold px-4 py-3 rounded-2xl shadow-2xl z-50 flex items-center gap-2 border border-emerald-500 animate-bounce">
              <CheckIcon className="w-5 h-5 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* HEADER BANNER - EXACT MATCH TO IMAGE */}
          <header className="bg-emerald-100/80 border border-emerald-200/90 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3.5">
              
              {/* Logo Box */}
              <div 
                onClick={() => logoInputRef.current?.click()}
                className="relative group cursor-pointer w-12 h-12 rounded-2xl bg-emerald-600 flex items-center justify-center text-white font-black shadow-md overflow-hidden shrink-0"
                title="Click to upload logo"
              >
                {customLogo ? (
                  <img src={customLogo} alt="Logo" className="w-full h-full object-cover" />
                ) : (
                  <BookIcon className="w-6 h-6 text-white" />
                )}
                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                  <UploadIcon className="w-4 h-4 text-white" />
                </div>
              </div>
              <input
                ref={logoInputRef}
                type="file"
                accept="image/*"
                onChange={handleLogoUpload}
                className="hidden"
              />

              <div>
                <h1 className="text-lg sm:text-2xl font-black text-slate-900 leading-snug">
                  Banahaw Viewdeck Samgyupsal - Lucban
                </h1>
                <div className="flex items-center gap-2 mt-0.5">
                  <span className="bg-emerald-700 text-white text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">
                    INVENTORY
                  </span>
                  <button 
                    onClick={() => logoInputRef.current?.click()}
                    className="text-xs text-slate-600 hover:text-emerald-800 font-semibold underline flex items-center gap-1"
                  >
                    Upload Logo
                  </button>
                </div>
              </div>
            </div>

            {/* Action Buttons */}
            <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
              
              {/* Delivery Popup Trigger Button */}
              <button
                onClick={handleOpenDeliveryModal}
                className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs sm:text-sm font-extrabold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm active:scale-95"
                title="Pop up delivery UI"
              >
                <TruckIcon className="w-4 h-4" />
                <span>+ Delivery</span>
              </button>

              <button
                onClick={generatePNG}
                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-extrabold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm active:scale-95"
              >
                <ShareIcon className="w-4 h-4" />
                <span>Export PNG</span>
              </button>
            </div>
          </header>

          {/* DATE & GUESTS CONTROL BAR - EXACT MATCH TO IMAGE */}
          <div className="bg-white border border-slate-200/90 rounded-2xl p-3 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            
            {/* Date Navigator */}
            <div className="flex items-center gap-3 border border-slate-200 rounded-xl px-3 py-2 bg-slate-50/50 w-full sm:w-auto justify-between">
              <button
                onClick={() => setSelectedDate(getPreviousDateISO(selectedDate))}
                className="p-1 text-slate-600 hover:text-slate-900 transition"
              >
                <ChevronLeftIcon className="w-4 h-4" />
              </button>

              <div className="flex items-center gap-2 font-black text-slate-800 text-sm">
                <CalendarIcon className="w-4 h-4 text-slate-600" />
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => setSelectedDate(e.target.value)}
                  className="bg-transparent font-black text-slate-900 outline-none cursor-pointer text-sm"
                />
              </div>

              <button
                onClick={() => setSelectedDate(getNextDateISO(selectedDate))}
                className="p-1 text-slate-600 hover:text-slate-900 transition"
              >
                <ChevronRightIcon className="w-4 h-4" />
              </button>
            </div>

            {/* Total Guests Box */}
            <div className="flex items-center gap-2 border border-slate-200 rounded-xl px-4 py-2 bg-slate-50/50 w-full sm:w-auto justify-between sm:justify-end">
              <div className="flex items-center gap-1.5 font-bold text-slate-800 text-xs sm:text-sm">
                <UsersIcon className="w-4 h-4 text-emerald-600" />
                <span>Total Guests:</span>
              </div>
              <input
                type="number"
                min="1"
                value={dayRecord.guestCount}
                onChange={(e) => updateGuestCount(e.target.value)}
                className="w-20 bg-blue-50/60 border border-slate-200 text-slate-900 font-extrabold text-sm text-center py-1 rounded-lg outline-none focus:border-emerald-500"
              />
            </div>

          </div>

          {/* 1. INITIAL SECTION CARD - EXACT MATCH TO IMAGE */}
          <div className="bg-white border border-slate-200/90 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4">
            
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <h2 className="text-sm font-black text-blue-900 uppercase tracking-wider">
                  INITIAL:
                </h2>
              </div>

              <div className="bg-blue-100/90 text-blue-900 font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm border border-blue-200">
                Total: {computed.totalInitKg.toFixed(1)} kg
              </div>
            </div>

            {/* Meat Input Fields Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              
              {/* Pork Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Pork</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.initialStock.pork}
                    onChange={(e) => updateInitialMeat('pork', e.target.value)}
                    className="w-24 bg-slate-100/80 border border-slate-200 text-slate-900 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-blue-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

              {/* Chicken Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Chicken</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.initialStock.chicken}
                    onChange={(e) => updateInitialMeat('chicken', e.target.value)}
                    className="w-24 bg-slate-100/80 border border-slate-200 text-slate-900 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-blue-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

              {/* Beef Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Beef</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.initialStock.beef}
                    onChange={(e) => updateInitialMeat('beef', e.target.value)}
                    className="w-24 bg-slate-100/80 border border-slate-200 text-slate-900 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-blue-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

            </div>

            {/* CREW MEAL STRIP - EXACT MATCH TO IMAGE */}
            <div className="bg-amber-50/80 border border-amber-200/90 rounded-xl p-2.5 sm:p-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2 font-black text-amber-900 text-xs sm:text-sm">
                <span>🍱</span>
                <span>CREW MEAL:</span>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={() => updateCrewMealOption('none')}
                  className={`px-3 py-1 rounded-lg font-extrabold text-xs transition ${
                    dayRecord.crewMealOption === 'none'
                      ? 'bg-amber-900 text-white shadow-sm'
                      : 'bg-amber-100/80 text-amber-900 hover:bg-amber-200/60'
                  }`}
                >
                  None
                </button>

                <button
                  type="button"
                  onClick={() => updateCrewMealOption('pork')}
                  className={`px-3 py-1 rounded-lg font-extrabold text-xs transition ${
                    dayRecord.crewMealOption === 'pork'
                      ? 'bg-amber-900 text-white shadow-sm'
                      : 'bg-amber-100/80 text-amber-900 hover:bg-amber-200/60'
                  }`}
                >
                  Pork
                </button>

                <button
                  type="button"
                  onClick={() => updateCrewMealOption('chicken')}
                  className={`px-3 py-1 rounded-lg font-extrabold text-xs transition ${
                    dayRecord.crewMealOption === 'chicken'
                      ? 'bg-amber-900 text-white shadow-sm'
                      : 'bg-amber-100/80 text-amber-900 hover:bg-amber-200/60'
                  }`}
                >
                  Chicken
                </button>
              </div>
            </div>

            {/* Optional Delivery Indicator summary inside Initial */}
            {dayRecord.deliveries.length > 0 && (
              <div className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 flex items-center justify-between">
                <span>🚚 Deliveries Added Today: +{computed.deliveriesTotal.pork + computed.deliveriesTotal.chicken + computed.deliveriesTotal.beef} kg total</span>
                <button onClick={handleOpenDeliveryModal} className="underline text-emerald-800 font-black">+ Add More</button>
              </div>
            )}

          </div>

          {/* 2. REMAINING SECTION CARD - EXACT MATCH TO IMAGE */}
          <div className="bg-white border border-slate-200/90 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4">
            
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                <h2 className="text-sm font-black text-emerald-900 uppercase tracking-wider">
                  REMAINING:
                </h2>
              </div>

              <div className="bg-emerald-100 text-emerald-900 font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm border border-emerald-200">
                Total: {computed.totalRemKg.toFixed(1)} kg
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              
              {/* Pork Remaining */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Pork</span>
                <div className="bg-emerald-100/70 border border-emerald-300/80 px-3 py-1.5 rounded-xl font-black text-emerald-900 text-sm font-mono">
                  {computed.remaining.pork.toFixed(1)} kg
                </div>
              </div>

              {/* Chicken Remaining */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Chicken</span>
                <div className="bg-emerald-100/70 border border-emerald-300/80 px-3 py-1.5 rounded-xl font-black text-emerald-900 text-sm font-mono">
                  {computed.remaining.chicken.toFixed(1)} kg
                </div>
              </div>

              {/* Beef Remaining */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Beef</span>
                <div className="bg-emerald-100/70 border border-emerald-300/80 px-3 py-1.5 rounded-xl font-black text-emerald-900 text-sm font-mono">
                  {computed.remaining.beef.toFixed(1)} kg
                </div>
              </div>

            </div>

          </div>

          {/* 3. CONSUMED SECTION CARD - EXACT MATCH TO IMAGE */}
          <div className="bg-white border border-slate-200/90 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4">
            
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-rose-600"></span>
                <h2 className="text-sm font-black text-rose-900 uppercase tracking-wider">
                  CONSUMED:
                </h2>
              </div>

              <div className="bg-rose-100/90 text-rose-900 font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm border border-rose-200">
                Total: {computed.totalConsKg.toFixed(1)} kg
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              
              {/* Pork Consumed Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Pork</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.consumed.pork}
                    onChange={(e) => updateConsumedMeat('pork', e.target.value)}
                    className="w-24 bg-rose-50/70 border border-rose-200 text-rose-800 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-rose-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

              {/* Chicken Consumed Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Chicken</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.consumed.chicken}
                    onChange={(e) => updateConsumedMeat('chicken', e.target.value)}
                    className="w-24 bg-rose-50/70 border border-rose-200 text-rose-800 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-rose-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

              {/* Beef Consumed Input */}
              <div className="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-2 bg-white">
                <span className="font-bold text-slate-800 text-sm">Beef</span>
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={dayRecord.consumed.beef}
                    onChange={(e) => updateConsumedMeat('beef', e.target.value)}
                    className="w-24 bg-rose-50/70 border border-rose-200 text-rose-800 font-black text-center text-sm py-1.5 rounded-xl outline-none focus:border-rose-500"
                  />
                  <span className="text-xs font-bold text-slate-500">kg</span>
                </div>
              </div>

            </div>

          </div>

          {/* 4. SUMMARY CARD - EXACT MATCH TO IMAGE */}
          <div className="bg-emerald-50/80 border border-emerald-200/90 rounded-2xl p-5 shadow-sm space-y-4">
            
            <h2 className="text-sm font-black text-slate-900 uppercase tracking-widest">
              SUMMARY
            </h2>

            <div className="border-b border-emerald-200"></div>

            <div className="space-y-3 text-sm font-bold">
              <div className="flex justify-between items-center">
                <span className="text-slate-800">Total amount of consumed:</span>
                <span className="text-rose-600 font-extrabold text-base font-mono">
                  {computed.totalConsKg.toFixed(1)} kg
                </span>
              </div>

              <div className="flex justify-between items-center">
                <span className="text-slate-800">Total number of guest:</span>
                <span className="text-slate-900 font-black text-base font-mono">
                  {computed.guests} Pax
                </span>
              </div>
            </div>

            {/* Calculated Factor Pill Box */}
            <div className="pt-2">
              <div className="bg-emerald-100/90 border border-emerald-300 rounded-2xl px-5 py-3 w-36 text-center font-mono font-black text-emerald-800 text-lg sm:text-xl shadow-inner">
                {computed.factorFormatted}
              </div>
            </div>

          </div>

          {/* FOOTER */}
          <footer className="text-center text-xs font-bold text-slate-500 pt-3">
            Banahaw Viewdeck Samgyupsal - Lucban • Daily Inventory Report
          </footer>

          {/* DELIVERY POPUP MODAL - USER REQUESTED FEATURE */}
          {isDeliveryModalOpen && (
            <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 border border-slate-200 animate-in fade-in duration-200">
                
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                      <TruckIcon className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base font-black text-slate-900">Add Meat Delivery / Stock</h3>
                      <p className="text-xs text-slate-500">{formatDateDisplay(selectedDate)}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsDeliveryModalOpen(false)}
                    className="text-slate-400 hover:text-slate-700 font-black text-lg p-1"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveDelivery} className="space-y-4">
                  
                  <div className="space-y-3">
                    
                    {/* Pork Delivery Input */}
                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
                      <span className="text-xs font-black text-slate-800 flex items-center gap-1.5">
                        <span>🐷</span> Pork Added
                      </span>
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          placeholder="0.0"
                          value={deliveryInput.pork}
                          onChange={(e) => setDeliveryInput({ ...deliveryInput, pork: e.target.value })}
                          className="w-24 bg-white border border-slate-300 text-slate-900 font-black font-mono text-center text-sm py-1.5 rounded-xl outline-none focus:border-emerald-500"
                        />
                        <span className="text-xs font-bold text-slate-500">kg</span>
                      </div>
                    </div>

                    {/* Chicken Delivery Input */}
                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
                      <span className="text-xs font-black text-slate-800 flex items-center gap-1.5">
                        <span>🐔</span> Chicken Added
                      </span>
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          placeholder="0.0"
                          value={deliveryInput.chicken}
                          onChange={(e) => setDeliveryInput({ ...deliveryInput, chicken: e.target.value })}
                          className="w-24 bg-white border border-slate-300 text-slate-900 font-black font-mono text-center text-sm py-1.5 rounded-xl outline-none focus:border-emerald-500"
                        />
                        <span className="text-xs font-bold text-slate-500">kg</span>
                      </div>
                    </div>

                    {/* Beef Delivery Input */}
                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
                      <span className="text-xs font-black text-slate-800 flex items-center gap-1.5">
                        <span>🥩</span> Beef Added
                      </span>
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          placeholder="0.0"
                          value={deliveryInput.beef}
                          onChange={(e) => setDeliveryInput({ ...deliveryInput, beef: e.target.value })}
                          className="w-24 bg-white border border-slate-300 text-slate-900 font-black font-mono text-center text-sm py-1.5 rounded-xl outline-none focus:border-emerald-500"
                        />
                        <span className="text-xs font-bold text-slate-500">kg</span>
                      </div>
                    </div>

                    {/* Optional Note */}
                    <div>
                      <label className="text-xs font-bold text-slate-600 mb-1 block">Supplier / Note (Optional)</label>
                      <input
                        type="text"
                        placeholder="e.g. Lucban Meat Supplier"
                        value={deliveryInput.note}
                        onChange={(e) => setDeliveryInput({ ...deliveryInput, note: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 text-slate-900 text-xs px-3.5 py-2 rounded-xl outline-none focus:border-emerald-500"
                      />
                    </div>

                  </div>

                  <div className="pt-2 flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setIsDeliveryModalOpen(false)}
                      className="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-md"
                    >
                      Add To Stock
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

          {/* EXPORT MODAL */}
          {isExportModalOpen && (
            <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <h3 className="font-black text-slate-900 text-base">Exported Inventory Report</h3>
                  <button
                    onClick={() => setIsExportModalOpen(false)}
                    className="text-slate-400 hover:text-slate-700 font-bold text-lg p-1"
                  >
                    ✕
                  </button>
                </div>

                {exportedPngUrl && (
                  <div className="rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 p-2 max-h-[60vh] overflow-y-auto">
                    <img src={exportedPngUrl} alt="Export PNG" className="w-full h-auto rounded-xl shadow-sm" />
                  </div>
                )}

                <div className="pt-2 flex items-center justify-end gap-3">
                  <a
                    href={exportedPngUrl}
                    download={`Banahaw_Meat_Inventory_${selectedDate}.png`}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 px-5 rounded-xl text-xs transition flex items-center gap-2 shadow-md"
                  >
                    <DownloadIcon className="w-4 h-4" />
                    <span>Download PNG Image</span>
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
