<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banahaw Viewdeck Samgyupsal - Meat Inventory</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone CDN to parse JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-emerald-100/60 via-slate-100 to-teal-100/50 min-h-screen text-slate-900 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    // SVG Icons
    const Calendar = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    );
    const Users = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    );
    const ChevronLeft = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
    );
    const ChevronRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
    );
    const Download = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    );
    const Copy = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    );
    const Check = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
    );
    const Utensils = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    );
    const Scale = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l9-4 9 4M3 6v14a2 2 0 002 2h14a2 2 0 002-2V6M3 6l9 6 9-6M12 12v10"/></svg>
    );
    const Share2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
    );
    const Upload = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
    );
    const ImageIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    );
    const AlertTriangle = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    );

    function getTodayISO() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function getPreviousDateISO(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    function getNextDateISO(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function formatPrettyDate(dateStr) {
      if (!dateStr) return '';
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', options);
    }

    const yesterdayISO = getPreviousDateISO(getTodayISO());
    const INITIAL_DATABASE = {
      [yesterdayISO]: {
        guestCount: 120,
        initial: { pork: 25.0, chicken: 18.0, beef: 20.0 },
        consumed: { pork: 12.5, chicken: 8.0, beef: 10.0 },
        crewMeal: { meat: 'pork', amount: 0.5 }
      }
    };

    function App() {
      const [selectedDate, setSelectedDate] = useState(getTodayISO());
      const [inventoryDb, setInventoryDb] = useState(INITIAL_DATABASE);
      const [toastMessage, setToastMessage] = useState('');
      const [isExportModalOpen, setIsExportModalOpen] = useState(false);
      const [generatedPngUrl, setGeneratedPngUrl] = useState('');
      const [isGeneratingPng, setIsGeneratingPng] = useState(false);
      const [customLogo, setCustomLogo] = useState(null);

      const fileInputRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          if (!file.type.startsWith('image/')) {
            showToast('Please upload a valid image file (PNG, JPG, SVG).');
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            setCustomLogo(event.target.result);
            showToast('Store logo updated successfully!');
          };
          reader.readAsDataURL(file);
        }
      };

      const currentRecord = useMemo(() => {
        const existing = inventoryDb[selectedDate];
        const prevDateISO = getPreviousDateISO(selectedDate);
        const prevRecord = inventoryDb[prevDateISO];

        let carriedInitial = { pork: 20.0, chicken: 15.0, beef: 15.0 };
        if (prevRecord) {
          const prevPorkInit = parseFloat(prevRecord.initial?.pork) || 0;
          const prevPorkCons = parseFloat(prevRecord.consumed?.pork) || 0;

          const prevChickInit = parseFloat(prevRecord.initial?.chicken) || 0;
          const prevChickCons = parseFloat(prevRecord.consumed?.chicken) || 0;

          const prevBeefInit = parseFloat(prevRecord.initial?.beef) || 0;
          const prevBeefCons = parseFloat(prevRecord.consumed?.beef) || 0;

          carriedInitial = {
            pork: Math.max(0, prevPorkInit - prevPorkCons),
            chicken: Math.max(0, prevChickInit - prevChickCons),
            beef: Math.max(0, prevBeefInit - prevBeefCons)
          };
        }

        if (existing) {
          return {
            guestCount: existing.guestCount ?? 92,
            initial: existing.initial || carriedInitial,
            consumed: existing.consumed || { pork: 0, chicken: 0, beef: 0 },
            crewMeal: existing.crewMeal || { meat: 'none', amount: 0.5 },
            isCarried: !existing.manualInitial && !!prevRecord
          };
        }

        return {
          guestCount: 92,
          initial: carriedInitial,
          consumed: { pork: 0, chicken: 0, beef: 0 },
          crewMeal: { meat: 'none', amount: 0.5 },
          isCarried: !!prevRecord
        };
      }, [selectedDate, inventoryDb]);

      const handleUpdateValue = (type, category, val) => {
        setInventoryDb(prev => {
          const dayData = prev[selectedDate] || { ...currentRecord };
          let parsedVal = val;
          if (val !== '') {
            const num = parseFloat(val);
            parsedVal = isNaN(num) ? 0 : Math.max(0, num);
          }

          const updatedCategoryMap = {
            ...(dayData[type] || {}),
            [category]: parsedVal
          };

          return {
            ...prev,
            [selectedDate]: {
              ...dayData,
              [type]: updatedCategoryMap,
              manualInitial: type === 'initial' ? true : dayData.manualInitial
            }
          };
        });
      };

      const handleUpdateCrewMeal = (meat, amount) => {
        setInventoryDb(prev => {
          const dayData = prev[selectedDate] || { ...currentRecord };
          return {
            ...prev,
            [selectedDate]: {
              ...dayData,
              crewMeal: {
                meat: meat !== undefined ? meat : (dayData.crewMeal?.meat || 'none'),
                amount: amount !== undefined ? amount : (dayData.crewMeal?.amount || 0.5)
              }
            }
          };
        });
      };

      const handleUpdateGuestCount = (val) => {
        const count = Math.max(1, parseInt(val, 10) || 1);
        setInventoryDb(prev => {
          const dayData = prev[selectedDate] || { ...currentRecord };
          return {
            ...prev,
            [selectedDate]: {
              ...dayData,
              guestCount: count
            }
          };
        });
      };

      const computed = useMemo(() => {
        const parseNum = (v) => (v === '' || v === undefined || v === null) ? 0 : (parseFloat(v) || 0);

        const init = {
          pork: parseNum(currentRecord.initial?.pork),
          chicken: parseNum(currentRecord.initial?.chicken),
          beef: parseNum(currentRecord.initial?.beef)
        };

        const cons = {
          pork: parseNum(currentRecord.consumed?.pork),
          chicken: parseNum(currentRecord.consumed?.chicken),
          beef: parseNum(currentRecord.consumed?.beef)
        };

        const crewMeat = currentRecord.crewMeal?.meat || 'none';
        const crewAmt = parseNum(currentRecord.crewMeal?.amount || 0.5);

        const crewMealPork = crewMeat === 'pork' ? crewAmt : 0;
        const crewMealChicken = crewMeat === 'chicken' ? crewAmt : 0;

        const guests = currentRecord.guestCount || 1;

        const remaining = {
          pork: Math.max(0, init.pork - cons.pork - crewMealPork),
          chicken: Math.max(0, init.chicken - cons.chicken - crewMealChicken),
          beef: Math.max(0, init.beef - cons.beef)
        };

        const totalInitial = init.pork + init.chicken + init.beef;
        const totalConsumed = cons.pork + cons.chicken + cons.beef;
        const totalRemaining = remaining.pork + remaining.chicken + remaining.beef;

        const factor = guests > 0 ? totalConsumed / guests : 0;
        const factorKg = factor.toFixed(3);
        const isHighFactor = factor > 0.380;

        return {
          initial: init,
          consumed: cons,
          remaining,
          crewMeal: { meat: crewMeat, amount: crewAmt, pork: crewMealPork, chicken: crewMealChicken },
          totalInitial,
          totalConsumed,
          totalRemaining,
          guests,
          factor,
          factorKg,
          isHighFactor
        };
      }, [currentRecord]);

      const generateCanvasPNG = async () => {
        setIsGeneratingPng(true);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 750;
        canvas.height = 1020;

        ctx.fillStyle = '#e8f5e9';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cardX = 35;
        const cardY = 35;
        const cardWidth = 680;
        const cardHeight = 950;

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 12;
        
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 24);
        ctx.fill();
        ctx.shadowColor = 'transparent';

        ctx.fillStyle = '#c8e6c9';
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardWidth, 110, [24, 24, 0, 0]);
        ctx.fill();

        if (customLogo) {
          try {
            const logoImg = new Image();
            logoImg.src = customLogo;
            await new Promise((resolve) => {
              logoImg.onload = resolve;
              logoImg.onerror = resolve;
            });

            ctx.save();
            ctx.beginPath();
            ctx.arc(cardX + 55, cardY + 55, 28, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(logoImg, cardX + 27, cardY + 27, 56, 56);
            ctx.restore();
          } catch (err) {
            ctx.fillStyle = '#1b5e20';
            ctx.beginPath();
            ctx.arc(cardX + 55, cardY + 55, 26, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(cardX + 55, cardY + 55, 26, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#2e7d32';
          ctx.beginPath();
          ctx.arc(cardX + 55, cardY + 55, 13, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#1b5e20';
        ctx.font = 'black 22px sans-serif';
        ctx.fillText('Banahaw Viewdeck Samgyupsal - Lucban', cardX + 95, cardY + 48);

        ctx.fillStyle = '#2e7d32';
        ctx.font = 'black 13px sans-serif';
        ctx.fillText('INVENTORY', cardX + 95, cardY + 74);

        ctx.fillStyle = '#f1f8e9';
        ctx.fillRect(cardX + 25, cardY + 125, cardWidth - 50, 48);
        ctx.strokeStyle = '#c8e6c9';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cardX + 25, cardY + 125, cardWidth - 50, 48);

        ctx.fillStyle = '#1b5e20';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`DATE: ${formatPrettyDate(selectedDate)}`, cardX + 45, cardY + 155);
        ctx.fillText(`GUESTS: ${computed.guests} Pax`, cardX + cardWidth - 210, cardY + 155);

        let startY = cardY + 190;

        const renderSection = (title, dataObj, totalVal, badgeBg, badgeText, extraBadge = '') => {
          ctx.fillStyle = badgeBg;
          ctx.fillRect(cardX + 25, startY, cardWidth - 50, 36);

          ctx.fillStyle = badgeText;
          ctx.font = 'black 16px sans-serif';
          ctx.fillText(title, cardX + 40, startY + 24);

          if (extraBadge) {
            ctx.fillStyle = '#b45309';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(extraBadge, cardX + 160, startY + 24);
          }

          ctx.fillStyle = badgeText;
          ctx.font = 'bold 16px monospace';
          ctx.fillText(`Total: ${totalVal.toFixed(1)} kg`, cardX + cardWidth - 180, startY + 24);

          startY += 42;

          const subitems = [
            { label: 'Pork', val: dataObj.pork, subTag: computed.crewMeal.meat === 'pork' ? `(-${computed.crewMeal.amount}kg crew)` : '' },
            { label: 'Chicken', val: dataObj.chicken, subTag: computed.crewMeal.meat === 'chicken' ? `(-${computed.crewMeal.amount}kg crew)` : '' },
            { label: 'Beef', val: dataObj.beef, subTag: '' }
          ];

          subitems.forEach(item => {
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(cardX + 25, startY, cardWidth - 50, 34);
            ctx.strokeStyle = '#e0e0e0';
            ctx.strokeRect(cardX + 25, startY, cardWidth - 50, 34);

            ctx.fillStyle = '#111827';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText(`• ${item.label}`, cardX + 50, startY + 23);

            if (title.startsWith('REMAINING') && item.subTag) {
              ctx.fillStyle = '#d97706';
              ctx.font = 'bold 12px sans-serif';
              ctx.fillText(item.subTag, cardX + 160, startY + 23);
            }

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 15px monospace';
            ctx.fillText(`${(item.val || 0).toFixed(1)} kg`, cardX + cardWidth - 160, startY + 23);

            startY += 36;
          });

          startY += 10;
        };

        const crewMealText = computed.crewMeal.meat !== 'none' 
          ? `[Crew Meal: -${computed.crewMeal.amount}kg ${computed.crewMeal.meat.toUpperCase()}]` 
          : '';

        renderSection('INITIAL:', computed.initial, computed.totalInitial, '#e3f2fd', '#0d47a1', crewMealText);
        renderSection('REMAINING:', computed.remaining, computed.totalRemaining, '#e8f5e9', '#1b5e20');
        renderSection('CONSUMED:', computed.consumed, computed.totalConsumed, '#ffebee', '#b71c1c');

        startY += 5;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cardX + 25, startY, cardWidth - 50, 135);
        ctx.strokeStyle = computed.isHighFactor ? '#ef4444' : '#a5d6a7';
        ctx.lineWidth = 2;
        ctx.strokeRect(cardX + 25, startY, cardWidth - 50, 135);

        ctx.fillStyle = '#1b5e20';
        ctx.font = 'black 16px sans-serif';
        ctx.fillText('SUMMARY', cardX + 40, startY + 30);

        ctx.fillStyle = '#374151';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`Total amount of consumed:`, cardX + 40, startY + 58);
        ctx.fillStyle = '#b71c1c';
        ctx.font = 'black 16px monospace';
        ctx.fillText(`${computed.totalConsumed.toFixed(1)} kg`, cardX + 280, startY + 58);

        ctx.fillStyle = '#374151';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`Total number of guest:`, cardX + 40, startY + 84);
        ctx.fillStyle = '#111827';
        ctx.font = 'black 16px monospace';
        ctx.fillText(`${computed.guests} Pax`, cardX + 280, startY + 84);

        ctx.fillStyle = computed.isHighFactor ? '#b91c1c' : '#1b5e20';
        ctx.font = 'black 18px monospace';
        ctx.fillText(`${computed.factorKg}`, cardX + 40, startY + 115);

        if (computed.isHighFactor) {
          ctx.fillStyle = '#dc2626';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`⚠️ High Rate (>0.380 benchmark)`, cardX + cardWidth - 280, startY + 115);
        }

        const dataUrl = canvas.toDataURL('image/png');
        setGeneratedPngUrl(dataUrl);
        setIsGeneratingPng(false);
        setIsExportModalOpen(true);
      };

      const handleDownloadPNG = () => {
        if (!generatedPngUrl) return;
        const a = document.createElement('a');
        a.href = generatedPngUrl;
        a.download = `Banahaw_Inventory_${selectedDate}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('PNG image downloaded successfully!');
      };

      const handleCopyPNGToClipboard = async () => {
        if (!generatedPngUrl) return;
        try {
          const response = await fetch(generatedPngUrl);
          const blob = await response.blob();
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          showToast('Copied to clipboard! Ready to paste in group chat.');
        } catch (err) {
          showToast('Please use Download PNG button.');
        }
      };

      return (
        <div className="p-3 sm:p-6 md:p-8">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl font-semibold text-xs shadow-2xl z-50 flex items-center gap-2 border border-slate-700 animate-bounce">
              <Check className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          <input
            type="file"
            ref={fileInputRef}
            onChange={handleLogoUpload}
            accept="image/*"
            className="hidden"
          />

          <div className="max-w-2xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl border border-slate-200/80 shadow-2xl overflow-hidden">
            
            <div className="bg-emerald-100/80 border-b border-emerald-200/60 p-5 sm:p-7 relative">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="relative group w-12 h-12 rounded-2xl bg-white flex-shrink-0 flex items-center justify-center border-2 border-emerald-300 shadow-md shadow-emerald-600/20 overflow-hidden hover:opacity-90 transition"
                    title="Click to Upload Store Logo"
                  >
                    {customLogo ? (
                      <img src={customLogo} alt="Store Logo" className="w-full h-full object-cover" />
                    ) : (
                      <div className="w-full h-full bg-emerald-600 flex items-center justify-center text-white">
                        <Utensils className="w-6 h-6" />
                      </div>
                    )}
                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white">
                      <Upload className="w-4 h-4" />
                    </div>
                  </button>

                  <div>
                    <h1 className="text-lg sm:text-xl md:text-2xl font-black text-slate-900 tracking-tight leading-tight">
                      Banahaw Viewdeck Samgyupsal - Lucban
                    </h1>
                    <div className="flex items-center gap-2 mt-1">
                      <span className="text-xs font-black bg-emerald-700 text-white px-3 py-0.5 rounded-full tracking-wider uppercase">
                        INVENTORY
                      </span>
                      <button
                        onClick={() => fileInputRef.current?.click()}
                        className="text-[11px] font-bold text-emerald-800 hover:text-emerald-950 underline underline-offset-2 flex items-center gap-1 ml-1"
                      >
                        <ImageIcon className="w-3 h-3" />
                        <span>Upload Logo</span>
                      </button>
                    </div>
                  </div>
                </div>

                <button
                  onClick={generateCanvasPNG}
                  disabled={isGeneratingPng}
                  className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-black px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 active:scale-95"
                >
                  <Share2 className="w-4 h-4" />
                  <span>Export PNG</span>
                </button>
              </div>
            </div>

            <div className="p-4 sm:p-5 bg-slate-50/80 border-b border-slate-200/60 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2 w-full sm:w-auto justify-between bg-white px-3 py-2 rounded-xl border border-slate-300 shadow-sm">
                <button
                  onClick={() => setSelectedDate(getPreviousDateISO(selectedDate))}
                  className="p-1 hover:bg-slate-100 rounded-lg text-slate-700 transition"
                  title="Previous Day"
                >
                  <ChevronLeft className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-2">
                  <Calendar className="w-4 h-4 text-emerald-700" />
                  <input
                    type="date"
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="bg-transparent text-xs sm:text-sm font-black text-slate-900 outline-none cursor-pointer"
                  />
                </div>

                <button
                  onClick={() => setSelectedDate(getNextDateISO(selectedDate))}
                  className="p-1 hover:bg-slate-100 rounded-lg text-slate-700 transition"
                  title="Next Day"
                >
                  <ChevronRight className="w-5 h-5" />
                </button>
              </div>

              <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-xl border border-slate-300 shadow-sm w-full sm:w-auto justify-between">
                <div className="flex items-center gap-1.5 text-xs sm:text-sm font-black text-slate-800">
                  <Users className="w-4 h-4 text-emerald-700" />
                  <span>Total Guests:</span>
                </div>
                <input
                  type="number"
                  min="1"
                  value={currentRecord.guestCount}
                  onChange={(e) => handleUpdateGuestCount(e.target.value)}
                  className="w-20 bg-slate-100 border border-slate-300 text-slate-900 font-black text-center text-xs sm:text-sm py-1 rounded-lg outline-none focus:border-emerald-600"
                />
              </div>
            </div>

            <div className="p-4 sm:p-6 space-y-6">

              {/* 1. INITIAL */}
              <div className="bg-slate-50/80 rounded-2xl border border-slate-200/90 p-4 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2.5">
                  <h2 className="text-xs sm:text-sm font-black text-blue-900 tracking-wider uppercase flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    INITIAL:
                  </h2>
                  <span className="text-xs sm:text-sm font-black font-mono text-blue-900 bg-blue-100 border border-blue-300 px-3 py-1 rounded-full">
                    Total: {computed.totalInitial.toFixed(1)} kg
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Pork</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.initial?.pork ?? 0}
                        onChange={(e) => handleUpdateValue('initial', 'pork', e.target.value)}
                        className="w-20 text-center bg-slate-100 font-mono font-black text-sm py-1 px-1 rounded-lg border border-slate-300 outline-none focus:border-blue-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Chicken</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.initial?.chicken ?? 0}
                        onChange={(e) => handleUpdateValue('initial', 'chicken', e.target.value)}
                        className="w-20 text-center bg-slate-100 font-mono font-black text-sm py-1 px-1 rounded-lg border border-slate-300 outline-none focus:border-blue-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Beef</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.initial?.beef ?? 0}
                        onChange={(e) => handleUpdateValue('initial', 'beef', e.target.value)}
                        className="w-20 text-center bg-slate-100 font-mono font-black text-sm py-1 px-1 rounded-lg border border-slate-300 outline-none focus:border-blue-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>
                </div>

                {/* Crew Meal Control Selector Box */}
                <div className="pt-2 border-t border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-amber-50/80 p-3 rounded-xl border border-amber-200/90">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black text-amber-900 uppercase tracking-wide flex items-center gap-1.5">
                      🍱 Crew Meal:
                    </span>
                    {currentRecord.crewMeal?.meat !== 'none' && (
                      <span className="text-[11px] font-bold text-amber-900 bg-amber-200/90 border border-amber-300 px-2 py-0.5 rounded-md">
                        Deducts -{currentRecord.crewMeal?.amount} kg from {currentRecord.crewMeal?.meat} remaining
                      </span>
                    )}
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <div className="flex items-center bg-white rounded-lg p-0.5 border border-amber-300/80 shadow-xs text-xs font-bold">
                      <button
                        type="button"
                        onClick={() => handleUpdateCrewMeal('none')}
                        className={`px-2.5 py-1 rounded-md transition ${
                          (currentRecord.crewMeal?.meat || 'none') === 'none'
                            ? 'bg-amber-800 text-white shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        None
                      </button>
                      <button
                        type="button"
                        onClick={() => handleUpdateCrewMeal('pork')}
                        className={`px-2.5 py-1 rounded-md transition ${
                          currentRecord.crewMeal?.meat === 'pork'
                            ? 'bg-amber-800 text-white shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Pork
                      </button>
                      <button
                        type="button"
                        onClick={() => handleUpdateCrewMeal('chicken')}
                        className={`px-2.5 py-1 rounded-md transition ${
                          currentRecord.crewMeal?.meat === 'chicken'
                            ? 'bg-amber-800 text-white shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Chicken
                      </button>
                    </div>

                    {currentRecord.crewMeal?.meat !== 'none' && (
                      <div className="flex items-center bg-white rounded-lg p-0.5 border border-amber-300/80 shadow-xs text-xs font-bold">
                        <button
                          type="button"
                          onClick={() => handleUpdateCrewMeal(undefined, 0.5)}
                          className={`px-2.5 py-1 rounded-md transition ${
                            (currentRecord.crewMeal?.amount || 0.5) === 0.5
                              ? 'bg-amber-600 text-white'
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          0.5 kg
                        </button>
                        <button
                          type="button"
                          onClick={() => handleUpdateCrewMeal(undefined, 1.0)}
                          className={`px-2.5 py-1 rounded-md transition ${
                            currentRecord.crewMeal?.amount === 1.0
                              ? 'bg-amber-600 text-white'
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          1.0 kg
                        </button>
                      </div>
                    )}
                  </div>
                </div>

              </div>

              {/* 2. REMAINING */}
              <div className="bg-slate-50/80 rounded-2xl border border-slate-200/90 p-4 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2.5">
                  <h2 className="text-xs sm:text-sm font-black text-emerald-900 tracking-wider uppercase flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                    REMAINING:
                  </h2>
                  <span className="text-xs sm:text-sm font-black font-mono text-emerald-900 bg-emerald-100 border border-emerald-300 px-3 py-1 rounded-full">
                    Total: {computed.totalRemaining.toFixed(1)} kg
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Pork</span>
                    <span className="font-mono font-black text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg shrink-0">
                      {computed.remaining.pork.toFixed(1)} kg
                    </span>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Chicken</span>
                    <span className="font-mono font-black text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg shrink-0">
                      {computed.remaining.chicken.toFixed(1)} kg
                    </span>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Beef</span>
                    <span className="font-mono font-black text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg shrink-0">
                      {computed.remaining.beef.toFixed(1)} kg
                    </span>
                  </div>
                </div>
              </div>

              {/* 3. CONSUMED */}
              <div className="bg-slate-50/80 rounded-2xl border border-slate-200/90 p-4 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2.5">
                  <h2 className="text-xs sm:text-sm font-black text-rose-900 tracking-wider uppercase flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-rose-600"></span>
                    CONSUMED:
                  </h2>
                  <span className="text-xs sm:text-sm font-black font-mono text-rose-900 bg-rose-100 border border-rose-300 px-3 py-1 rounded-full">
                    Total: {computed.totalConsumed.toFixed(1)} kg
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Pork</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.consumed?.pork ?? 0}
                        onChange={(e) => handleUpdateValue('consumed', 'pork', e.target.value)}
                        className="w-20 text-center bg-rose-50 text-rose-900 font-mono font-black text-sm py-1 px-1 rounded-lg border border-rose-300 outline-none focus:border-rose-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Chicken</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.consumed?.chicken ?? 0}
                        onChange={(e) => handleUpdateValue('consumed', 'chicken', e.target.value)}
                        className="w-20 text-center bg-rose-50 text-rose-900 font-mono font-black text-sm py-1 px-1 rounded-lg border border-rose-300 outline-none focus:border-rose-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-300 flex items-center justify-between gap-2 shadow-sm min-w-0">
                    <span className="text-sm font-bold text-slate-800 shrink-0">Beef</span>
                    <div className="flex items-center gap-1 shrink-0">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        value={currentRecord.consumed?.beef ?? 0}
                        onChange={(e) => handleUpdateValue('consumed', 'beef', e.target.value)}
                        className="w-20 text-center bg-rose-50 text-rose-900 font-mono font-black text-sm py-1 px-1 rounded-lg border border-rose-300 outline-none focus:border-rose-600"
                      />
                      <span className="text-xs text-slate-500 font-bold">kg</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className={`rounded-2xl border-2 p-5 space-y-3.5 shadow-sm transition ${
                computed.isHighFactor 
                  ? 'bg-rose-50/90 border-rose-300' 
                  : 'bg-emerald-50/80 border-emerald-200/90'
              }`}>
                <div className="flex items-center justify-between border-b border-emerald-200 pb-2.5">
                  <span className="text-sm font-black text-slate-900 tracking-wider uppercase flex items-center gap-2">
                    <Scale className="w-4.5 h-4.5 text-emerald-700" />
                    Summary
                  </span>

                  {computed.isHighFactor && (
                    <span className="flex items-center gap-1.5 bg-rose-600 text-white text-xs font-black px-2.5 py-1 rounded-full shadow-sm animate-pulse">
                      <AlertTriangle className="w-3.5 h-3.5" />
                      High Rate (&gt;0.380)
                    </span>
                  )}
                </div>

                <div className="space-y-2.5 text-sm">
                  <div className="flex items-center justify-between">
                    <span className="text-slate-800 font-bold">Total amount of consumed:</span>
                    <span className="font-mono font-black text-rose-700 text-base">{computed.totalConsumed.toFixed(1)} kg</span>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-slate-800 font-bold">Total number of guest:</span>
                    <span className="font-mono font-black text-slate-900 text-base">{computed.guests} Pax</span>
                  </div>

                  <div className="pt-3 border-t border-emerald-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                      <p className={`text-lg sm:text-xl font-mono font-black px-4 py-2 rounded-xl inline-block shadow-sm ${
                        computed.isHighFactor
                          ? 'bg-rose-100 text-rose-900 border border-rose-300'
                          : 'bg-emerald-100/90 text-emerald-900 border border-emerald-300'
                      }`}>
                        {computed.factorKg}
                      </p>
                    </div>

                    {computed.isHighFactor && (
                      <p className="text-xs font-bold text-rose-700">
                        *Exceeds target benchmark threshold of 0.380
                      </p>
                    )}
                  </div>
                </div>
              </div>

            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200/60 text-center text-xs font-bold text-slate-500">
              Banahaw Viewdeck Samgyupsal - Lucban • Daily Inventory Report
            </div>

          </div>

          {/* EXPORT PNG MODAL */}
          {isExportModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-black text-slate-900 text-base">Image Export Ready</h3>
                    <p className="text-xs text-slate-500">Formatted for group chat sharing</p>
                  </div>
                  <button 
                    onClick={() => setIsExportModalOpen(false)} 
                    className="text-slate-400 hover:text-slate-600 font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-slate-100 rounded-2xl p-2 max-h-[50vh] overflow-y-auto flex items-center justify-center">
                  {generatedPngUrl ? (
                    <img 
                      src={generatedPngUrl} 
                      alt="Inventory Report PNG" 
                      className="max-w-full h-auto rounded-xl shadow-sm border border-slate-200"
                    />
                  ) : (
                    <div className="p-8 text-xs text-slate-400">Generating report...</div>
                  )}
                </div>

                <div className="flex flex-col sm:flex-row items-center justify-end gap-2 pt-1">
                  <button
                    onClick={handleCopyPNGToClipboard}
                    className="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 transition"
                  >
                    <Copy className="w-4 h-4 text-slate-500" /> Copy Image
                  </button>

                  <button
                    onClick={handleDownloadPNG}
                    className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-5 py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-md shadow-emerald-600/20"
                  >
                    <Download className="w-4 h-4" /> Download PNG
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
